<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WGT</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial}
.app{max-width:420px;margin:0 auto;padding-bottom:80px}
.top{margin:10px;background:#141414;border:1px solid #333;border-radius:12px;padding:12px;text-align:center;color:gold;font-weight:bold}
.c{display:flex;justify-content:center;margin:10px}
.c img{width:260px;border-radius:50%;border:3px solid gold}
.box{display:flex;gap:10px;padding:10px}
.card{flex:1;background:#111;border:1px solid #333;border-radius:10px;padding:12px;text-align:center}
.sec{display:none;padding:10px}
.sec.on{display:block}
.bottom{
position:fixed;bottom:0;left:0;right:0;
max-width:420px;margin:0 auto;
background:#1a1a1a;border-top:2px solid gold;
display:flex;justify-content:space-around;
padding:8px 0;z-index:9999;
}
.b{color:#fff;text-align:center;font-size:11px;cursor:pointer;padding:5px}
.b.on{color:gold}
.b span{font-size:24px;display:block}
</style>
</head>
<body>
<div class="app">
<div id="d" class="sec on">
<div class="top">WGT Mining Dashboard</div>
<div class="c"><img src="token.jpg"></div>
<div class="box">
<div class="card">HASH<br><b>1.24 GH/s</b></div>
<div class="card">EARN<br><b>0.042 WGT</b></div>
</div>
</div>
<div id="m" class="sec">
<div class="top">Mine WGT</div>
<div style="text-align:center;padding:30px">
<img src="token.jpg" style="width:200px;border-radius:50%">
<h3 style="color:gold">Mining Active</h3>
<p>Tap to Boost Mining</p>
</div>
</div>
<div id="w" class="sec">
<div class="top">Wallet</div>
<div style="text-align:center;padding:20px"><h1>1.458 WGT</h1><p>~$652 USD</p></div>
</div>
<div id="r" class="sec">
<div class="top">Refer</div>
<div style="text-align:center;padding:20px">
<p>Earn 0.01 WGT per referral</p>
<div style="background:#111;border:1px dashed gold;padding:10px;border-radius:8px">t.me/WolfGoldToken_bot</div>
</div>
</div>
<div id="s" class="sec">
<div class="top">Settings</div>
<div style="padding:20px">
<div style="background:#111;padding:10px;border-radius:8px;margin-bottom:10px">🔔 Notifications ON</div>
<div style="background:#111;padding:10px;border-radius:8px">🌐 Language: English</div>
</div>
</div>
</div>
<div class="bottom">
<div id="bd" class="b on" onclick="go('d','bd')"><span>📊</span>Dash</div>
<div id="bm" class="b" onclick="go('m','bm')"><span>⛏️</span>Mine</div>
<div id="bw" class="b" onclick="go('w','bw')"><span>💼</span>Wallet</div>
<div id="br" class="b" onclick="go('r','br')"><span>👥</span>Refer</div>
<div id="bs" class="b" onclick="go('s','bs')"><span>⚙️</span>Set</div>
</div>
<script>
function go(a,b){
document.querySelectorAll('.sec').forEach(x=>x.classList.remove('on'));
document.getElementById(a).classList.add('on');
document.querySelectorAll('.b').forEach(x=>x.classList.remove('on'));
document.getElementById(b).classList.add('on');
window.scrollTo(0,0);
}
</script>
</body>
</html>
